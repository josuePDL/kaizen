<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizen - Punto de Venta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div style="display: flex; justify-content: center; width: 100%; gap: 15px;">
      <a href="index.html">🔍 Buscador</a>
      <a href="venta.html">🛒 Ventas</a>
    </div>
  </nav>

  <div class="container flex-2-col">
    <!-- Panel Catálogo -->
    <div class="col-7 panel">
      <h2>Productos (Clic para vender)</h2>
      <input type="text" id="buscador" placeholder="Buscar por Nombre o Código de barras..." onkeyup="filtrar()">
      <div class="grid-productos" id="grid"></div>
    </div>

    <!-- Panel Carrito -->
    <div class="col-3 panel" style="background: var(--morado-oscuro); color: white;">
      <h2 style="color: white; margin-top: 0;">Carrito</h2>
      <div id="carrito-lista" style="min-height: 200px;">
        <p style="text-align: center; color: #ce93d8;">El carrito está vacío</p>
      </div>
      <hr style="border-color: var(--morado-claro);">
      <h3>Total: Q<span id="total">0.00</span></h3>
      <button onclick="cobrar()" style="background: white; color: var(--morado-oscuro); font-size: 1.2em;">Cobrar Venta</button>
    </div>
  </div>

  <!-- Modal para seleccionar cantidad -->
  <div id="modal-cantidad" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modal-titulo" style="color: var(--morado-oscuro); margin-top: 0;">Producto</h2>
      <p style="color: #666; font-weight: bold;">Stock disponible: <span id="modal-stock"></span></p>
      <label for="modal-input-cant">Cantidad a vender:</label>
      <input type="number" id="modal-input-cant" value="1" min="1">
      <div class="flex-botones">
        <button onclick="confirmarAgregar()">Agregar al Carrito</button>
        <button onclick="cerrarModal()" class="btn-danger">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="venta.js"></script>
</body>
</html>
