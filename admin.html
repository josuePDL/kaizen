<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizen - Administración</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <nav>
    <div style="display: flex; justify-content: center; width: 100%; gap: 15px; align-items: center; flex-wrap: wrap;">
      <a href="index.html">🔍 Buscador</a>
      <a href="venta.html">🛒 Ventas</a>
      <a href="admin.html">⚙️ Admin</a>
      <button onclick="abrirModalForm()" style="background: var(--morado-claro); color: var(--morado-oscuro); padding: 8px 15px; border-radius: 4px; margin: 0; width: auto; border: 2px solid white;">
        ➕ Agregar Producto
      </button>
    </div>
  </nav>

  <div class="container flex-2-col">
    
    <!-- Panel de Edición -->
    <div class="col-3 panel">
      <h2 id="titulo-form">Editar Producto</h2>
      <p style="font-size: 0.85em; color: #666;">Selecciona un producto de la tabla para corregir sus datos.</p>
      
      <form id="form-editar" onsubmit="guardarEdicion(event)">
        <input type="hidden" id="prod-fila" value="">

        <label style="font-size: 0.85em; color: var(--morado-medio); font-weight: bold;">Código / ID de Barras:</label>
        <input type="text" id="prod-codigo" required>

        <label style="font-size: 0.85em; color: var(--morado-medio);">Nombre del producto:</label>
        <input type="text" id="prod-nombre" required>

        <label style="font-size: 0.85em; color: var(--morado-medio);">Descripción:</label>
        <textarea id="prod-desc" rows="3"></textarea>

        <label style="font-size: 0.85em; color: var(--morado-medio);">Precio Venta (Q):</label>
        <input type="number" id="prod-precio" step="0.01" required>

        <label style="font-size: 0.85em; color: var(--morado-medio);">Cantidad / Stock:</label>
        <input type="number" id="prod-cantidad" required>

        <button type="submit" id="btn-submit" disabled>Selecciona un producto</button>
        <button type="button" onclick="cancelarEdicion()" class="btn-danger" style="display:none;" id="btn-cancelar">Cancelar</button>
      </form>
    </div>

    <!-- Tabla de Inventario -->
    <div class="col-7 panel" style="overflow-x: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2>Inventario General</h2>
        <button onclick="cargarDatos()" style="width: auto; padding: 6px 12px; font-size: 0.9em;">🔄 Refrescar</button>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre / Descripción</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-admin">
          <tr><td colspan="5" style="text-align: center;">Cargando inventario...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- MODAL: VENTANA FLOTANTE PARA GOOGLE FORMS -->
  <div id="modal-form" class="modal-overlay">
    <div class="modal-content" style="max-width: 800px; width: 95%; height: 90vh; display: flex; flex-direction: column; padding: 15px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 style="margin: 0; color: var(--morado-oscuro);">Registrar Nuevo Producto</h2>
        <!-- Al cerrar, se refresca automáticamente la tabla -->
        <button onclick="cerrarModalForm()" class="btn-danger" style="width: auto; padding: 8px 15px; margin: 0;">✖ Cerrar y Refrescar</button>
      </div>
      
      <!-- AQUÍ ESTÁ TU ENLACE INTEGRADO -->
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScq9EBMKzV99g7B2eDVYEfvPc03oC8MDE_rRSVB_O0UlRbAMQ/viewform?embedded=true" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0" style="flex-grow: 1; border-radius: 5px; border: 1px solid #ccc; background: white;">Cargando formulario...</iframe>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
